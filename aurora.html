<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI BIZNES WOLNOŚĆ — Czat z Asystentem [Danie 2]</title>
<meta name="description" content="Ostatni reset zasad gry cywilizacji. Zarejestruj się na webinar rozmawiając z naszym asystentem AI.">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-aurora: #0f1224;
    --card-glass: rgba(255, 255, 255, 0.08);
    --border-glass: rgba(255, 255, 255, 0.12);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --c-accent: #6366f1; /* Indigo */
    --c-accent2: #a855f7; /* Purple */
    --c-teal: #14b8a6;
    --c-rose: #f43f5e;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-aurora);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  * { box-sizing: border-box; }

  /* Smooth flowing background colors */
  .aurora-backdrop {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1;
    overflow: hidden;
    filter: blur(120px);
    pointer-events: none;
    opacity: 0.6;
  }
  .aurora-blob {
    position: absolute;
    border-radius: 50%;
    animation: move-blobs 25s infinite alternate ease-in-out;
  }
  .blob-purple { top: -20%; left: -10%; width: 60vw; height: 60vw; background: #6366f1; }
  .blob-teal { bottom: -20%; right: -10%; width: 55vw; height: 55vw; background: #14b8a6; animation-delay: -6s; }
  .blob-pink { top: 30%; left: 30%; width: 50vw; height: 50vw; background: #ec4899; animation-delay: -12s; }

  @keyframes move-blobs {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { transform: translate(60px, -60px) scale(1.15) rotate(120deg); }
  }

  .main-chat-layout {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 24px;
  }

  .chat-box {
    width: 100%;
    max-width: 650px;
    height: 92vh;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid var(--border-glass);
    border-radius: 24px;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Chat Header */
  .chat-top {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border-glass);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.4);
  }
  .bot-identity {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar-logo {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-accent) 0%, var(--c-accent2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }
  .bot-desc h3 {
    margin: 0;
    font-size: 1.05rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
  }
  .bot-desc p {
    margin: 2px 0 0;
    font-size: 0.8rem;
    color: #10b981;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .live-indicator {
    width: 7px;
    height: 7px;
    background: #10b981;
    border-radius: 50%;
    animation: flash 1.6s infinite;
  }

  .viewers-stats-header {
    font-size: 0.8rem;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-glass);
  }

  /* Message Area */
  .chat-feed {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg-bubble-row {
    display: flex;
    width: 100%;
  }
  .msg-bubble-row.bot { justify-content: flex-start; }
  .msg-bubble-row.user { justify-content: flex-end; }

  .bubble-wrap {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 20px;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .bot .bubble-wrap {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    border-top-left-radius: 4px;
    border: 1px solid var(--border-glass);
  }
  .user .bubble-wrap {
    background: linear-gradient(135deg, var(--c-accent) 0%, var(--c-accent2) 100%);
    color: #fff;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
  }

  /* Custom embedded layout elements inside bot message */
  .embed-box {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--border-glass);
    border-radius: 16px;
    padding: 16px;
    margin-top: 10px;
    font-size: 0.9rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .embed-heading {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    color: #fff;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Speaker card embedded */
  .speaker-embed {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .speaker-embed img {
    width: 65px;
    height: 80px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border-glass);
  }

  /* Option Buttons inside chat */
  .embed-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .action-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-glass);
    color: #fff;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    text-align: left;
    transition: all 0.2s;
    font-size: 0.88rem;
  }
  .action-btn:hover {
    background: var(--c-accent);
    border-color: var(--c-accent);
  }

  /* Option shortcuts (chips) at bottom */
  .chat-bottom-chips {
    padding: 0 24px 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .shortcut-chip {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-glass);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .shortcut-chip:hover {
    border-color: var(--c-accent);
    color: #fff;
    background: rgba(99, 102, 241, 0.1);
  }

  /* Bottom Send Bar */
  .send-bar {
    padding: 18px 24px;
    border-top: 1px solid var(--border-glass);
    background: rgba(15, 23, 42, 0.4);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .send-input {
    flex: 1;
    padding: 14px 20px;
    border-radius: 99px;
    border: 1px solid var(--border-glass);
    outline: none;
    font-size: 0.95rem;
    font-family: inherit;
    background: rgba(255, 255, 255, 0.03);
    color: #fff;
    transition: border-color 0.2s;
  }
  .send-input:focus {
    border-color: var(--c-accent);
  }
  .btn-submit-arrow {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-accent) 0%, var(--c-accent2) 100%);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    transition: transform 0.2s;
  }
  .btn-submit-arrow:hover { transform: scale(1.05); }

  /* Typing simulation dots */
  .typing-loader {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    border-top-left-radius: 4px;
    width: fit-content;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce-dots 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }

  /* Compliance / checkboxes cards inside chat */
  .compliance-card {
    background: rgba(244, 63, 94, 0.05);
    border: 1px dashed var(--c-rose);
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
  }
  .compliance-card label {
    display: flex;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1.4;
  }
  .compliance-card label input { margin-top: 2px; }
  .compliance-card a { color: var(--c-accent2); text-decoration: none; font-weight: bold; }

  @keyframes flash {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.4; }
  }
  @keyframes bounce-dots {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
</style>
</head>
<body>

  <div class="aurora-backdrop">
    <div class="aurora-blob blob-purple"></div>
    <div class="aurora-blob blob-teal"></div>
    <div class="aurora-blob blob-pink"></div>
  </div>

  <div class="main-chat-layout">
    <div class="chat-box">
      
      <!-- Top header -->
      <div class="chat-top">
        <div class="bot-identity">
          <div class="avatar-logo">D</div>
          <div class="bot-desc">
            <h3>Dionizos AI Bot</h3>
            <p><span class="live-indicator"></span> Połączenie nawiązane</p>
          </div>
        </div>
        <div class="viewers-stats-header">
          Aktywni użytkownicy: <span id="counter-val" style="color:#fff; font-weight:bold;">...</span>
        </div>
      </div>

      <!-- Feed -->
      <div class="chat-feed" id="chat-win">
        <div class="msg-bubble-row bot">
          <div class="bubble-wrap">
            Cześć! Jestem asystentem webinaru **AI BIZNES WOLNOŚĆ**. 🤖
          </div>
        </div>

        <div class="msg-bubble-row bot">
          <div class="bubble-wrap" id="date-label">
            Ładowanie parametrów spotkania live z Krzysztofem Królem...
          </div>
        </div>

        <div id="loader-bubble" class="msg-bubble-row bot" style="display: none;">
          <div class="typing-loader">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      </div>

      <!-- Option Chips -->
      <div class="chat-bottom-chips" id="chips-dock">
        <!-- Rendered dynamically -->
      </div>

      <!-- Input Send Area -->
      <div class="send-bar">
        <input type="text" class="send-input" id="msg-input" placeholder="Napisz odpowiedź..." autocomplete="off">
        <button class="btn-submit-arrow" id="btn-send">➔</button>
      </div>

    </div>
  </div>

  <script>
    (function(){
      "use strict";

      var chatWin = document.getElementById('chat-win');
      var msgInput = document.getElementById('msg-input');
      var btnSend = document.getElementById('btn-send');
      var loaderBubble = document.getElementById('loader-bubble');
      var chipsDock = document.getElementById('chips-dock');

      var state = {
        step: 0,
        name: '',
        hours: 15,
        rate: 80,
        email: ''
      };

      // Date Setup - Next Sunday 10:00 CEST (Warsaw)
      var monthNames = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
      function getWarsawTime(now) {
        try {
          var formatter = new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Warsaw', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false });
          var parts = {};
          formatter.formatToParts(now).forEach(function(p) { if (p.type !== 'literal') parts[p.type] = parseInt(p.value, 10); });
          var warsawDate = new Date(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
          return { date: warsawDate, dayOfWeek: warsawDate.getDay(), year: parts.year, month: parts.month - 1, day: parts.day, hour: parts.hour };
        } catch (e) {
          return { date: now, dayOfWeek: now.getDay(), year: now.getFullYear(), month: now.getMonth(), day: now.getDate(), hour: now.getHours() };
        }
      }

      function setupDate() {
        var now = new Date();
        var w = getWarsawTime(now);
        var daysToAdd = 7 - w.dayOfWeek;
        if (w.dayOfWeek === 0 && w.hour < 10) daysToAdd = 0;
        var targetWarsaw = new Date(w.year, w.month, w.day);
        targetWarsaw.setDate(w.day + daysToAdd);
        targetWarsaw.setHours(10, 0, 0, 0);

        var day = targetWarsaw.getDate();
        var month = monthNames[targetWarsaw.getMonth()];
        var dateLabel = document.getElementById('date-label');
        if (dateLabel) {
          dateLabel.innerHTML = "Najbliższa sesja szkoleniowa live odbędzie się w **niedzielę, " + day + " " + month + " o godz. 10:00 CEST (ONLINE)**. Wolnych portów rezerwacyjnych: <span style='color:#ef4444; font-weight:800;'>42</span>.";
        }
      }

      // Live viewers count (201-243)
      var viewersVal = Math.floor(Math.random() * (243 - 201 + 1)) + 201;
      function updateViewers() {
        viewersVal += Math.floor(Math.random() * 5) - 2;
        if (viewersVal < 201) viewersVal = 201;
        if (viewersVal > 243) viewersVal = 243;
        var span = document.getElementById('counter-val');
        if (span) span.textContent = viewersVal;
      }
      setInterval(updateViewers, 3000);
      updateViewers();

      // Bot message poster with loader delay simulation
      function postBotMsg(text, delay, callback, embedElement) {
        chatWin.appendChild(loaderBubble);
        loaderBubble.style.display = 'flex';
        chatWin.scrollTop = chatWin.scrollHeight;

        setTimeout(function() {
          loaderBubble.style.display = 'none';
          var row = document.createElement('div');
          row.className = 'msg-bubble-row bot';
          var bubble = document.createElement('div');
          bubble.className = 'bubble-wrap';
          bubble.innerHTML = text;
          row.appendChild(bubble);
          chatWin.appendChild(row);

          if (embedElement) {
            chatWin.appendChild(embedElement);
          }

          chatWin.scrollTop = chatWin.scrollHeight;
          if (callback) callback();
        }, delay || 1000);
      }

      function postUserMsg(text) {
        var row = document.createElement('div');
        row.className = 'msg-bubble-row user';
        var bubble = document.createElement('div');
        bubble.className = 'bubble-wrap';
        bubble.textContent = text;
        row.appendChild(bubble);
        chatWin.appendChild(row);
        chatWin.scrollTop = chatWin.scrollHeight;
      }

      function showChips(chips, callback) {
        chipsDock.innerHTML = '';
        chips.forEach(function(c) {
          var btn = document.createElement('div');
          btn.className = 'shortcut-chip';
          btn.textContent = c.label;
          btn.addEventListener('click', function() {
            postUserMsg(c.label);
            chipsDock.innerHTML = '';
            callback(c.value);
          });
          chipsDock.appendChild(btn);
        });
      }

      // Conversation workflow tree
      function nextStep(userVal) {
        if (state.step === 0) {
          state.step = 1;
          postBotMsg("Przed rezerwacją biletu chciałbym zadać Ci 2 krótkie pytania, by dopasować przykłady automatyzacji do Twojego profilu. **Jak masz na imię?**", 800);
        }
        else if (state.step === 1) {
          state.name = userVal;
          state.step = 2;
          postBotMsg("Cześć, **" + state.name + "**! Ile godzin w skali tygodnia poświęcasz na mechaniczne, powtarzalne procesy (wpisywanie faktur, maile, tworzenie prostych postów)?", 1000, function(){
            showChips([
              { label: "Około 5 godzin", value: 5 },
              { label: "Średnio 15 godzin", value: 15 },
              { label: "Dużo, ponad 30 godzin", value: 30 }
            ], function(val){
              nextStep(val);
            });
          });
        }
        else if (state.step === 2) {
          state.hours = parseInt(userVal, 10) || 15;
          state.step = 3;
          postBotMsg("Rozumiem. Podaj w przybliżeniu **wycenę jednej godziny Twojej pracy** (lub stawkę rynkową w PLN za godzinę wykonywania tych zadań):", 800, function(){
            showChips([
              { label: "40 PLN/h", value: 40 },
              { label: "80 PLN/h", value: 80 },
              { label: "150 PLN/h", value: 150 }
            ], function(val){
              nextStep(val);
            });
          });
        }
        else if (state.step === 3) {
          state.rate = parseInt(userVal, 10) || 80;
          state.step = 4;

          var monthlyHoursSaved = Math.round(state.hours * 4.33 * 0.5);
          var monthlyMoneySaved = monthlyHoursSaved * state.rate;

          var embed = document.createElement('div');
          embed.className = 'embed-box';
          embed.innerHTML = 
            `<div class="embed-heading">📊 SKALA STRAT FINANSOWYCH:</div>` +
            `<div>Czas odzyskiwany przy wdrożeniu AI: <b>${monthlyHoursSaved} godzin / mies.</b></div>` +
            `<div>Budżet bezproduktywny: <b>${monthlyMoneySaved.toLocaleString('pl-PL')} PLN / mies.</b></div>` +
            `<div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">Zastąpienie żmudnych procesów darmowymi botami uwalnia te zasoby natychmiast.</div>`;

          postBotMsg("Wyliczyłem Twój potencjał optymalizacji:", 1000, function(){
            postBotMsg("Te procesy oraz sylabus wdrożeniowy zostaną omówione na żywo. Co chciałbyś sprawdzić w następnym kroku?", 800, function(){
              showChips([
                { label: "Sprawdź Program Szkolenia 📚", value: 'syllabus' },
                { label: "Kim jest Prelegent? 👤", value: 'bio' },
                { label: "Rezerwuj Darmowy Bilet 🔥", value: 'register' }
              ], function(val){
                nextStep(val);
              });
            });
          }, embed);
        }
        else if (state.step === 4) {
          if (userVal === 'syllabus') {
            var embedSyl = document.createElement('div');
            embedSyl.className = 'embed-box';
            embedSyl.innerHTML = 
              `<div class="embed-heading">📚 PROGRAM (3 KLUCZOWE MODUŁY):</div>` +
              `<div class="embed-actions">` +
                `<button class="action-btn" onclick="showModuleDetails(1)">Moduł I: Automatyzacja Pracy (Make/Zapier/Prompty)</button>` +
                `<button class="action-btn" onclick="showModuleDetails(2)">Moduł II: Bezpieczeństwo i Prawo (RODO / AI Act)</button>` +
                `<button class="action-btn" onclick="showModuleDetails(3)">Moduł III: Landing Pages & Multimedia w 10 min</button>` +
              `</div>`;

            postBotMsg("Oto ustrukturyzowany program szkolenia. Kliknij w dany moduł aby zobaczyć specyfikację techniczną:", 800, function(){
              showChips([
                { label: "Kim jest Prelegent? 👤", value: 'bio' },
                { label: "Rezerwuj Darmowy Bilet 🔥", value: 'register' }
              ], function(val){
                nextStep(val);
              });
            }, embedSyl);
          }
          else if (userVal === 'bio') {
            var embedBio = document.createElement('div');
            embedBio.className = 'embed-box';
            embedBio.innerHTML = 
              `<div class="embed-heading">👤 WIZYTÓWKA PROWADZĄCEGO:</div>` +
              `<div class="speaker-embed">` +
                `<img src="https://transformacja90dni.pl/wp-content/uploads/2026/06/foto-2.jpg" alt="Krzysztof Król">` +
                `<div>` +
                  `<div style="font-weight:bold; color:#fff;">dr Krzysztof Król</div>` +
                  `<div style="font-size:0.8rem; color:var(--c-teal); margin-bottom:4px;">Ekspert Wdrożeń AI</div>` +
                  `<div style="font-size:0.8rem; line-height:1.35; color:var(--text-muted);">Autor 9 podręczników Helion (50k+ nakładu), rezydent Phuket. Zbudował 7 działających produktów SaaS generujących przychód.</div>` +
                `</div>` +
              `</div>` +
              `<div style="font-style:italic; font-size:0.82rem; margin-top:10px; color:#c084fc;">"Nie uczę teorii z podręczników. Uczę wyłącznie systemów, które sam zakodowałem."</div>`;

            postBotMsg("Poznaj prelegenta:", 800, function(){
              showChips([
                { label: "Sprawdź Program Szkolenia 📚", value: 'syllabus' },
                { label: "Rezerwuj Darmowy Bilet 🔥", value: 'register' }
              ], function(val){
                nextStep(val);
              });
            }, embedBio);
          }
          else if (userVal === 'register') {
            state.step = 5;
            postBotMsg("Doskonale! Podaj swój **adres e-mail**, na który wyślę oficjalne zaproszenie wraz z linkiem wejścia live:", 800);
          }
        }
        else if (state.step === 5) {
          var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(userVal)) {
            postBotMsg("Podany e-mail jest niepoprawny. Wpisz poprawny adres e-mail:", 800);
            return;
          }
          state.email = userVal;
          state.step = 6;

          var embedConsent = document.createElement('div');
          embedConsent.className = 'embed-box';
          embedConsent.innerHTML = 
            `<div class="embed-heading">🔑 FINALIZACJA AUTORYZACJI:</div>` +
            `<div class="compliance-card">` +
              `<label>` +
                `<input type="checkbox" id="chk-cons">` +
                `<span>Wyrażam zgodę na otrzymywanie materiałów szkoleniowych oraz newslettera. Administratorem danych jest organizator projektu. Szczegóły w <a href="https://twojainteligencja.elms.pl/next/public/pages/privacy_policy" target="_blank" rel="noopener">Polityce Prywatności</a> oraz <a href="https://twojainteligencja.elms.pl/next/public/pages/regulations?locale=pl" target="_blank" rel="noopener">Regulaminie</a>. *</span>` +
              `</label>` +
            `</div>` +
            `<button class="action-btn" id="chk-confirm-btn" style="width:100%; text-align:center; background:linear-gradient(135deg, var(--c-accent), var(--c-accent2)); margin-top:10px;">ZAPISZ SIĘ BEZPŁATNIE ⚡</button>`;

          postBotMsg("Do zakończenia rejestracji wymagane jest zatwierdzenie zgody prawnej:", 800, function(){
            var chk = document.getElementById('chk-cons');
            var btn = document.getElementById('chk-confirm-btn');
            if (chk && btn) {
              btn.addEventListener('click', function(){
                if (chk.checked) {
                  postUserMsg("Zaakceptowano warunki i zatwierdzono zapis.");
                  btn.disabled = true;
                  btn.textContent = "Weryfikacja zgłoszenia...";
                  setTimeout(function(){
                    state.step = 7;
                    nextStep('final');
                  }, 1200);
                } else {
                  alert("Zaznacz wymagany checkbox zgody RODO.");
                }
              });
            }
          }, embedConsent);
        }
        else if (state.step === 7) {
          postBotMsg("⭐ **REJESTRACJA UKOŃCZONA SUKCESEM!** ⭐", 600, function(){
            postBotMsg("Twój bezpłatny bilet na niedzielne szkolenie live został wygenerowany. Wysłaliśmy go na adres: **" + state.email + "**.\n\nSprawdź skrzynkę odbiorczą za około 2 minuty (również foldery Oferty i Spam). Do zobaczenia o 10:00 CEST!", 800);
          });
        }
      }

      window.showModuleDetails = function(modNum) {
        var txt = "";
        if (modNum === 1) {
          txt = "🤖 **Moduł I: Automatyzacja Pracy bez Kodowania**<br><br>Nauczysz się pisać precyzyjne prompty dla ChatGPT, które nie brzmią syntetycznie. Zbudujemy prosty workflow w Make.com łączący arkusze Google, automatyczne powiadomienia i szablony mailowe, co uwalnia do 15 godzin mechanicznej pracy w tygodniu.";
        } else if (modNum === 2) {
          txt = "🛡️ **Moduł II: Bezpieczeństwo i Prawo (RODO / AI Act)**<br><br>Dowiesz się, jak zasilić asystenta AI własnymi plikami i bazą wiedzy firmowej bez ryzyka upublicznienia danych. Omówimy prawne aspekty praw autorskich generowanych dzieł oraz wytyczne europejskiego AI Act.";
        } else if (modNum === 3) {
          txt = "🖼️ **Moduł III: Landing Pages & Multimedia w 10 Minut**<br><br>Poznasz techniki klonowania głosu lektorskiego i szybkiego montażu wideo reklamowych. Zobaczymy na żywo, jak postawić gotową do sprzedaży stronę sprzedażową (landing page) w zaledwie 10 minut, wykorzystując darmowe generatory AI.";
        }
        postBotMsg(txt, 500);
      }

      function sendUserTyped() {
        var text = msgInput.value.trim();
        if (text.length > 0) {
          msgInput.value = '';
          postUserMsg(text);
          setTimeout(function(){
            nextStep(text);
          }, 300);
        }
      }

      btnSend.addEventListener('click', sendUserTyped);
      msgInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter') sendUserTyped();
      });

      setupDate();
      setTimeout(function(){
        nextStep();
      }, 1000);

    })();
  </script>
</body>
</html>
